name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Compile (devkitARM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache devkitPro
        uses: actions/cache@v4
        with:
          path: /opt/devkitpro
          key: ${{ runner.os }}-devkit-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-devkit-
      - name: Install devkitPro
        run: |
          sudo apt-get update
          sudo apt-get install -y wget libarchive-tools unzip
          wget -q -O - https://apt.devkitpro.org/install-devkitpro-pacman | sudo sh -x
      - name: Install 3DS toolchain and portlibs
        run: |
          export DEVKITARM=/opt/devkitpro/devkitARM
          export DEVKITPRO=/opt/devkitpro
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm 3ds-dev 3ds-curl 3ds-libjson-c 3ds-libvorbisidec 3ds-libjpeg-turbo 3ds-libarchive
      - name: Install bannertool and makerom
        run: |
          wget -q -O bannertool.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
          mkdir -p bannertool
          tar -xzf bannertool.tar.gz -C bannertool --strip-components=1
          sudo install -m 755 bannertool/bannertool /usr/local/bin/bannertool
          wget -q -O makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -q makerom.zip -d makerom
          sudo install -m 755 makerom/makerom /usr/local/bin/makerom
          command -v bannertool
          command -v makerom
      - name: Build
        run: |
          export DEVKITARM=/opt/devkitpro/devkitARM
          export DEVKITPRO=/opt/devkitpro
          make 2>&1 | tee build.log
        shell: bash -eo pipefail {0}
      - name: Check for warnings
        run: |
          if grep -E "warning:|error:" build.log; then
            echo "Build produced warnings or errors"
            exit 1
          fi
